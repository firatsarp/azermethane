services:
  azermethane:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - EARTHDATA_USERNAME=${EARTHDATA_USERNAME}
      - EARTHDATA_PASSWORD=${EARTHDATA_PASSWORD}
      - BACKFILL_DAYS=${BACKFILL_DAYS:-14}
    volumes:
      - azermethane-data:/data

volumes:
  azermethane-data:
